global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "application-server"
    static_configs:
      - targets: ["APPLICATION_SERVER_PRIVATE_IP:9100"]

  - job_name: "kubernetes-pods"
    metrics_path: /metrics
    static_configs:
      - targets: ["APPLICATION_SERVER_PRIVATE_IP:8080"]
